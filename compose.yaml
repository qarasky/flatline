# Production stack: API backend, operator dashboard, public status site.
#
# Backend origin from a browser's point of view defaults to
# http://127.0.0.1:3001 (set BACKEND_URL to the LAN host or public origin
# when browsers are elsewhere). The status site reaches the backend
# container-to-container, so it needs no browser-reachable default.
#
# First run: the dashboard shows first-run setup — create the operator
# account there. No token pasting, no seed scripts.
#
# Behind a reverse proxy, point all three at one origin instead: the
# password unlock posts cross-origin otherwise, and the browser will not
# keep the unlock cookie.

services:
  flatline:
    build:
      context: .
      dockerfile: docker/dockerfile
      target: release
    image: artchsh/flatline:2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    # Healthcheck comes from the image (curl against the API index).

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.dockerfile
    image: artchsh/flatline-dashboard:2
    restart: unless-stopped
    ports:
      - "3003:80"
    environment:
      FLATLINE_URL: ${BACKEND_URL:-http://127.0.0.1:3001}
    depends_on:
      flatline:
        condition: service_healthy

  status-site:
    build:
      context: .
      dockerfile: docker/status-site.dockerfile
      args:
        NEXT_PUBLIC_FLATLINE_URL: ${BACKEND_URL:-http://127.0.0.1:3001}
    image: artchsh/flatline-status:2
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      FLATLINE_URL: http://flatline:3001
    depends_on:
      flatline:
        condition: service_healthy
