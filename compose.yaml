# Production stack (v2 consolidation): one process serves the API and the
# web app — operator dashboard and public status pages.
#
# First run: the dashboard shows first-run setup — create the operator
# account there. No token pasting, no seed scripts.
#
# One origin by design: the password unlock posts same-origin, so the
# browser keeps the unlock cookie with no CORS or proxy configuration.

services:
  flatline:
    build:
      context: .
      dockerfile: docker/dockerfile
      target: release
    image: artchsh/flatline:2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    # Healthcheck comes from the image (curl against the API index).
