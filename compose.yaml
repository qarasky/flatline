# Production stack: one process serves the API, the web app (operator
# dashboard and public status pages) and the agent downloads.
#
# The backend is the Rust service in backend-rs/; docker/rust.dockerfile also
# builds the dashboard and the Go agent into the same image.
#
# First run: the operator token is written to
# ./data/initial-token.txt (mode 0600) — use it to sign in. There is no
# account setup, no seed script and no Node runtime.

services:
  flatline:
    build:
      context: .
      dockerfile: docker/rust.dockerfile
      target: release
    image: artchsh/flatline:2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    # Backend graceful shutdown finishes within ~20 s (streams close, engine
    # and metrics jobs flush); Docker's default 10 s would SIGKILL it.
    stop_grace_period: 30s
    # The backend runs as uid 10001 (see docker/entrypoint.sh). ICMP ping
    # monitors use unprivileged ICMP sockets, allowed here for every group,
    # with the ping binary's cap_net_raw as the fallback.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    # Bounded resources: a leak or runaway fork cannot take the host down.
    # Normal usage is far below both; check with `docker stats`.
    mem_limit: 1g
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Healthcheck comes from the image: GET /healthz (database + engine).
