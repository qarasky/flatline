# Production stack: one process serves the API, the web app (operator
# dashboard and public status pages) and the agent downloads.
#
# The backend is the Rust service in backend-rs/; docker/rust.dockerfile also
# builds the dashboard and the Go agent into the same image.
#
# First run: the operator token is written to
# ./data/initial-token.txt (mode 0600) — use it to sign in. There is no
# account setup, no seed script and no Node runtime.

services:
  flatline:
    build:
      context: .
      dockerfile: docker/rust.dockerfile
      target: release
    image: artchsh/flatline:2
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "3001:3001"
    # Healthcheck comes from the image (curl against the setup endpoint).
