# Office stack: one pre-built image, one origin. The Cloudflare Tunnel already
# points at localhost:3001.
#
# The image is built on the host from the synced source tree:
#
#   cd /home/office/flatline-src
#   sudo docker build --platform linux/amd64 -f docker/rust.dockerfile \
#       -t artchsh/flatline-rust:office-live .
#   cd /home/office/flatline && sudo docker compose -f compose.rust.yaml up -d
#
# The repository copy of this file and the office copy are kept identical.
# Steps, backup paths and the rollback procedure: docs/deployment.md.
#
# `FLATLINE_PORT` is the published port; `FLATLINE_BIND` defaults to loopback
# so the tunnel is the only way in from outside.
name: flatline-rust

services:
  flatline:
    image: artchsh/flatline-rust:office-live
    restart: unless-stopped
    environment:
      # Absolute origin used in the provisioning docs/scripts; without it
      # the request's Host header is used.
      FLATLINE_PUBLIC_URL: ${FLATLINE_PUBLIC_URL:-}
    volumes:
      - ./data-rust:/app/data
    ports:
      - "${FLATLINE_BIND:-127.0.0.1}:${FLATLINE_PORT:-3101}:3001"
