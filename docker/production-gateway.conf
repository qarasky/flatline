server {
    listen 80;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 10m;

    location /api/ {
        # Push credentials are in upstream-compatible URLs; never log them.
        access_log off;
        proxy_pass http://flatline:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
    location /upload/ {
        proxy_pass http://flatline:3001;
        proxy_set_header Host $host;
    }
    # Everything else — the operator dashboard and the public status pages,
    # which are one SPA since the v2 consolidation — is the dashboard image.
    location / {
        proxy_pass http://dashboard:80;
        proxy_set_header Host $host;
    }
}
