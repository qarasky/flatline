# Standalone single-origin stack (v2 consolidation): the backend serves the
# API and the web app — operator dashboard and public status pages. Stage
# with FLATLINE_PORT=3101, then switch to 3001 for the existing Cloudflare
# Tunnel. Nothing else is exposed.
services:
  flatline:
    image: artchsh/flatline:office-live
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    ports:
      - "${FLATLINE_BIND:-127.0.0.1}:${FLATLINE_PORT:-3101}:3001"
